<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>集卡完成度</title>
  <link rel="stylesheet" href="card-collection.css" />
</head>
<body>
  <div id="cardsMount"></div>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    (async function () {
      const mount = document.getElementById("cardsMount");
      const html = await fetch("card-collection.panel.html").then((r) => r.text());
      mount.innerHTML = html;
      const s = document.createElement("script");
      s.src = "card-collection.js";
      s.onload = () => window.initPronteraCards().catch((e) => {
        console.error(e);
        mount.innerHTML = "<p style=\"padding:24px;color:#FF3B30\">集卡模块加载失败</p>";
      });
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
