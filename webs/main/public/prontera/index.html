        <link rel="stylesheet" href="card-collection.css">
        <style>
        :root {
            --bg-color: #F5F5F7;
            --container-bg: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --accent-blue: #0071E3;
            --accent-blue-hover: #0077ED;
            --border-color: #D2D2D7;
            --input-bg: #F5F5F7;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--container-bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text-primary); 
            -webkit-font-smoothing: antialiased;
        }
        .container { 
            width: 100%;
            margin: 0; 
            background: var(--container-bg); 
        }
        .global-sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        
        .header-section {
            padding: 16px 24px 0 24px;
            position: relative;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }
        h1 { 
            text-align: center; 
            font-weight: 600; 
            font-size: 1.5em; 
            letter-spacing: -0.02em; 
            margin: 0 0 12px 0;
        }
        .nav-row {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 12px;
        }
        
                        .tabs { 
            display: flex; 
            background-color: #E3E3E8; 
            padding: 4px; 
            border-radius: 12px; 
            width: max-content;
        }
        .tab { 
            padding: 8px 24px; 
            cursor: pointer; 
            font-weight: 500; 
            color: var(--text-secondary); 
            border-radius: 8px; 
            transition: all 0.2s ease; 
            font-size: 0.95em;
        }
        .tab.active { 
            background-color: #FFFFFF; 
            color: var(--text-primary); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
        }
        .tab:hover:not(.active) { color: var(--text-primary); }
        .tab-content { 
            display: none; 
            flex-direction: column;
        }
        .tab-content.active { 
            display: flex; 
            animation: fadeIn 0.3s ease; 
        }
        #cards.cards-embed {
            display: none;
        }
        #cards.cards-embed.active {
            display: block;
        }
        #cards.cards-embed .cards-root {
            width: 100%;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        input[type="text"], select { 
            padding: 12px 16px; 
            width: 320px; 
            background-color: var(--input-bg);
            border: 1px solid transparent; 
            border-radius: 12px; 
            margin-right: 12px; 
            margin-bottom: 20px;
            font-size: 1em;
            color: var(--text-primary);
            transition: all 0.2s ease;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.2);
            background-color: #FFFFFF;
        }
        input::placeholder { color: var(--text-secondary); }
        
        button { 
            padding: 12px 24px; 
            background-color: var(--accent-blue); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 1em;
            font-weight: 500;
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        button:hover { background-color: var(--accent-blue-hover); transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { 
            padding: 16px; 
            text-align: left; 
            border-bottom: 1px solid var(--border-color); 
        }
        th { 
            color: var(--text-secondary); 
            font-weight: 500; 
            font-size: 0.9em; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border-color);
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #F9F9FA; }
        
                        .item-icon { 
            width: 36px; 
            height: 36px; 
            vertical-align: middle; 
            margin-right: 12px; 
            object-fit: contain; 
            image-rendering: pixelated; 
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
            background: transparent;
        }
        
        .tree-node { margin-left: 24px; position: relative; }
        .tree-node::before { content: ''; position: absolute; left: -14px; top: 0; bottom: 0; border-left: 2px solid #E5E5EA; }
        .tree-node-item { display: flex; align-items: center; padding: 8px 0; position: relative; }
        .tree-node-item::before { content: ''; position: absolute; left: -14px; top: 26px; width: 14px; border-top: 2px solid #E5E5EA; }
        .tree-root { margin-left: 0; font-weight: 600; font-size: 1.15em; padding: 16px 0; border-bottom: 1px solid var(--border-color);}
        .tree-root::before { display: none; }
        .tree-root > .tree-node-item::before { display: none; }

        .tree-toggle { 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            width: 22px; 
            height: 22px; 
            border-radius: 50%; 
            margin-right: 10px; 
            font-weight: bold; 
            background: #F2F2F7; 
            color: var(--text-secondary);
            user-select: none; 
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .tree-toggle:hover { background: #E5E5EA; color: var(--text-primary); }
        .tree-children { display: none; }
        .tree-children.expanded { display: block; }
        
        .clickable-item { cursor: pointer; color: var(--accent-blue); text-decoration: none; font-weight: 500; transition: color 0.2s; }
        .clickable-item:hover { text-decoration: underline; color: var(--accent-blue-hover); }
        .controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 16px;
            padding: 0 24px; 
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .controls-left, .controls-right { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        /* Make form elements smaller and perfectly aligned inside controls */
        .controls input[type="text"] {
            margin-bottom: 0;
            padding: 8px 12px;
            height: 36px;
            font-size: 0.9em;
            border-radius: 8px;
            width: 240px;
        }
        .controls button {
            padding: 0 16px;
            height: 36px;
            font-size: 0.9em;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .toggle-btn { 
            background-color: #E5E5EA; 
            color: var(--text-primary); 
            border: 1px solid transparent;
        }
        .toggle-btn.active { 
            background-color: var(--text-primary); 
            color: white; 
        }
        
        /* The expand all button inline styles overrides need to be fixed in HTML but we can target it here */
        #expandAllBtn {
            margin-left: 0 !important;
            padding: 0 12px !important;
            background-color: var(--accent-blue) !important;
            color: white;
            font-size: 0.85em !important;
        }
        
        .empty-state { text-align: center; color: var(--text-secondary); padding: 60px; font-size: 1.1em; }
        
        .badge { 
            background-color: #FF3B30; 
            color: white; 
            padding: 4px 8px; 
            border-radius: 12px; 
            font-size: 0.75em; 
            font-weight: 600;
            margin-left: 8px;

        .badge.info { background-color: var(--accent-blue); }
        
        .usage-item { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding: 12px 0; }

            display: flex; 
            align-items: center;
        }
        
                                #homeBtn {

            border-radius: 8px;

            transition: all 0.2s;
        }
        #homeBtn:hover {
            background-color: #E5E5EA;
        }
    </style>
</head>

        function loadScriptOnce(src) {
            return new Promise((resolve, reject) => {
                const existed = document.querySelector(`script[data-src="${src}"]`);
                if (existed) {
                    if (existed.dataset.loaded === "1") resolve();
                    else existed.addEventListener("load", () => resolve(), { once: true });
                    return;
                }
                const s = document.createElement("script");
                s.src = src;
                s.dataset.src = src;
                s.onload = () => {
                    s.dataset.loaded = "1";
                    resolve();
                };
                s.onerror = () => reject(new Error("脚本加载失败: " + src));
                document.body.appendChild(s);
            });
        }

                const h = headgearMap[name];
                if (h && h.materials && h.materials.length > 0) {
                    h.materials.forEach(m => traverse(m.name, m.qty * qty));
                } else {
                    reqs[name] = (reqs[name] || 0) + qty;
                }
            }
            traverse(itemName, qtyMultiplier);
            
            let html = `<div class="tree-node tree-root">`;
            html += `<div class="tree-node-item" style="margin-bottom: 5px;">`;
            html += getIconImg(hg.id, itemName);
            html += `<span class="clickable-item" onclick="document.getElementById('hgSearch').value='${itemName}'; searchHeadgear();">${itemName}</span> ${hg.id ? '<span style="color:#95a5a6;font-size:0.8em">['+hg.id+']</span>' : ''} <span class="badge info">x${qtyMultiplier}</span> - 扁平总需材料`;
            html += `<span style="font-size:0.8em; color:#7f8c8d; margin-left:10px;">[位置:${hg.position}] [洞:${hg.slot}] [属性: ${hg.attr}]</span></div>`;
            
            html += `<table class="flat-table"><thead><tr><th>材料名称</th><th>总需数量</th></tr></thead><tbody>`;
            Object.keys(reqs).sort((a,b)=>reqs[b]-reqs[a]).forEach(mName => {
                const mData = Object.values(itemMap).find(i => i.name === mName) || {id: null};
                html += `<tr><td>${getIconImg(mData.id, mName)} <span class="clickable-item" onclick="document.getElementById('hgSearch').value='${mName}'; searchHeadgear();">${mName}</span> ${mData.id ? '<span style="color:#95a5a6;font-size:0.8em">['+mData.id+']</span>' : ''}</td><td>x${reqs[mName]}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        function getReverseTreeHTML(itemName, requiredQty = 1, currentDepth = 0) {
            const usages = [];
            headgearData.forEach(hg => {
                const mat = hg.materials.find(m => m.name === itemName);
                if (mat) {
                    usages.push({ hg: hg, qty: mat.qty });
                }
            });
            
            const itemInfo = Object.values(itemMap).find(i => i.name === itemName) || headgearMap[itemName] || { id: null };
            const id = itemInfo.id || (headgearMap[itemName] ? headgearMap[itemName].id : null);
            
            let html = `<div class="tree-node ${currentDepth === 0 ? 'tree-root' : ''}">`;
            html += `<div class="tree-node-item">`;
            
            const hasChildren = usages.length > 0;
            const childrenId = 'rev-tree-children-' + (++treeIdCounter);
            
            if (hasChildren) {
                html += `<span class="tree-toggle" onclick="toggleTree(this, '${childrenId}')">+</span>`;
            } else {
                html += `<span style="display:inline-block; width: 23px;"></span>`;
            }
            
            html += getIconImg(id, itemName);
            html += `<span class="clickable-item" onclick="document.getElementById('hgSearch').value='${itemName}'; searchHeadgear();">${itemName}</span> ${id ? '<span style="color:#95a5a6;font-size:0.8em">['+id+']</span>' : ''}`;
            
            if (currentDepth > 0) {
                 html += ` <span style="color:#e74c3c; font-size:0.9em; margin-left: 10px;">← 制作1件需前方材料 x${requiredQty}</span>`;
            } else {
                 html += ` <span style="color:#e74c3c; font-size:0.9em; margin-left: 10px;">(目标材料)</span>`;
            }
            html += `</div>`;
            
            if (hasChildren) {
                html += `<div id="${childrenId}" class="tree-children" style="margin-left: ${currentDepth === 0 ? '0' : '20px'}">`;
                usages.forEach(u => {
                    html += getReverseTreeHTML(u.hg.name, u.qty, currentDepth + 1);
                });
                html += `</div>`;
            }
            html += `</div>`;
            return html;
        }

        function renderReverseSearch(targetItem) {
            let html = `<div style="margin-top: 26px; padding-top: 15px; border-top: 2px dashed #bdc3c7;">`;
            const isFlat = currentDisplayMode === 'flat';
            html += `<h4 style="color: #e74c3c; margin-top:0;">⚠️ 反向查询 (${isFlat ? '扁平-所有依赖汇总' : '层级-反向溯源树'}): [ ${targetItem} ]</h4>`;
            
            if (isFlat) {
                const usages = [];
                headgearData.forEach(hg => {
                    if (hg.name === targetItem) return;
                    let needed = 0;
                    function traverse(name, qty) {
                        if (name === targetItem) { needed += qty; return; }
                        const h = headgearMap[name];
                        if (h && h.materials) {
                            h.materials.forEach(m => traverse(m.name, m.qty * qty));
                        }
                    }
                    traverse(hg.name, 1);
                    if (needed > 0) {
                        usages.push({ hg: hg, qty: needed });
                    }
                });
                usages.sort((a,b) => b.qty - a.qty);
                
                if (usages.length === 0) return '';
                
                html += `<table class="flat-table"><thead><tr><th>最终制作头饰</th><th>每件共需 [ ${targetItem} ] 数量</th></tr></thead><tbody>`;
                usages.forEach(u => {
                    html += `<tr>`;
                    html += `<td>${getIconImg(u.hg.id, u.hg.name)} <strong class="clickable-item" onclick="document.getElementById('hgSearch').value='${u.hg.name}'; searchHeadgear();">${u.hg.name}</strong> ${u.hg.id ? '<span style="color:#95a5a6;font-size:0.8em">['+u.hg.id+']</span>' : ''}</td>`;
                    html += `<td>x${u.qty}</td>`;
                    html += `</tr>`;
                });
                html += `</tbody></table>`;
            } else {
                html += `<div style="background: #fff8f8; padding: 15px; border-radius: 5px; border-left: 4px solid #e74c3c;">`;
                html += getReverseTreeHTML(targetItem, 1, 0);
                html += `</div>`;
            }
            html += `</div>`;
            return html;
        }

        function resetHgSearch() {
            document.getElementById('hgSearch').value = '';
            searchHeadgear();
        }

        function searchHeadgear() {
            isExpandedAll = false;
            const eBtn = document.getElementById('expandAllBtn');
            if (eBtn) eBtn.innerText = '展开全部';

            const q = document.getElementById('hgSearch').value.trim().toLowerCase();
            const resDiv = document.getElementById('hgResult');
            
            let html = '';
            
            if (!q) {
                // Display all headgears by default
                html += `<h3>所有头饰配方列表 (${headgearData.length}个)</h3>`;
                headgearData.forEach(hg => {
                    if (currentDisplayMode === 'hierarchical') {
                        html += getMaterialTreeHTML(hg.name, 1);
                    } else {
                        html += getFlatMaterialsHTML(hg.name, 1);
                    }
                });
                resDiv.innerHTML = html;
                return;
            }
            
            // 1. Is it a headgear name exactly or partially? (Forward search)
            const matchedHgs = headgearData.filter(hg => 
                hg.name.toLowerCase().includes(q) || 
                (hg.id && hg.id.toString() === q) ||
                (hg.attr && hg.attr.toLowerCase().includes(q))
            );
            
            if (matchedHgs.length > 0) {
                html += `<h3>正向查询结果 (${matchedHgs.length}个配方)</h3>`;
                matchedHgs.forEach(hg => {
                    if (currentDisplayMode === 'hierarchical') {
                        html += getMaterialTreeHTML(hg.name, 1);
                    } else {
                        html += getFlatMaterialsHTML(hg.name, 1);
                    }
                });
            }
            
            // 2. Is it a material? (Reverse search)
            // Try to identify the item being searched
            let targetItems = [];
            const isId = !isNaN(q) && q.length > 0;
            
            if (isId) {
                const item = itemMap[parseInt(q)];
                if (item) targetItems.push(item);
            } else {
                // Find all materials matching name
                const matchedNames = new Set();
                headgearData.forEach(hg => {
                    hg.materials.forEach(m => {
                        if (m.name.toLowerCase().includes(q)) {
                            matchedNames.add(m.name);
                        }
                    });
                });
                
                matchedNames.forEach(name => {
                    const item = Object.values(itemMap).find(i => i.name === name) || { name: name, id: null };
                    targetItems.push(item);
                });
            }
            
            if (targetItems.length > 0) {
                targetItems.forEach(target => {
                    const revHtml = renderReverseSearch(target.name);
                    if (revHtml.includes("<table") || revHtml.includes("tree-children")) { html += revHtml; }
                });
            }
            
            if (!html) {
                html = '<div class="empty-state">未找到匹配的头饰或材料</div>';
            }
            
            resDiv.innerHTML = html;
        }

        // Init
        renderPets(petData);
        searchHeadgear();
    </script>
</body>
</html>
